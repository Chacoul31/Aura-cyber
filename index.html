<script>
const $ = id => document.getElementById(id);
const messages = $('messages'), input = $('input'), toast = $('toast');

let lastQuery = '', isGenerating = false, activeChatIndex = -1;
let rawCodeStore = [];

const nearBottom = () => messages.scrollHeight - messages.scrollTop - messages.clientHeight < 150;
const scrollToBottom = () => { if (nearBottom()) messages.scrollTop = messages.scrollHeight; };

const HERO_HTML = `
  <div class="hero" id="hero">
    <h1><br><em>~/workspace$Admin@338 </em></h1>
    <p>Cyber Aura  designed for Cybersecurity </p>
    <div class="chips" id="chips"></div>
  </div>`;

/* ================================================================
   1. PARSER DATASETS
   ================================================================ */
function parseDataFile(raw) {
  let cleaned = raw.trim();
  const pairs = [];

  if (cleaned.startsWith('[') || cleaned.startsWith('{') || cleaned.startsWith('data =')) {
    let jsonStr = cleaned.replace(/^\s*(?:const|let|var)\s+data\s*=\s*/i, '').trim();
    if (jsonStr.endsWith(';')) jsonStr = jsonStr.slice(0, -1);
    jsonStr = jsonStr.replace(/\(\s*(["'].*?["'])\s*,\s*(["'].*?["'])\s*\)/g, '[$1, $2]');
    
    try {
      const parsed = JSON.parse(jsonStr);
      const list = Array.isArray(parsed) ? parsed : [parsed];
      list.forEach(item => {
        let q = Array.isArray(item) ? item[0] : (item.q || item.question || '');
        let a = Array.isArray(item) ? item[1] : (item.a || item.answer || item.response || '');
        if (q && a) pairs.push({ q: String(q).trim(), a: formatOutputCode(String(a).trim()) });
      });
      if (pairs.length) return pairs;
    } catch (e) {}
  }

  const regexTuple = /(?:\(|\[)\s*(?:"((?:[^"\\]|\\.)*)"|'((?:[^'\\]|\\.)*)')\s*,\s*(?:"((?:[^"\\]|\\.)*)"|'((?:[^'\\]|\\.)*)')\s*(?:\)|\])/g;
  let match;
  while ((match = regexTuple.exec(cleaned)) !== null) {
    const q = (match[1] !== undefined ? match[1] : match[2]).replace(/\\n/g, '\n').replace(/\\"/g, '"');
    const a = (match[3] !== undefined ? match[3] : match[4]).replace(/\\n/g, '\n').replace(/\\"/g, '"');
    if (q.trim() && a.trim()) pairs.push({ q: q.trim(), a: formatOutputCode(a.trim()) });
  }
  if (pairs.length) return pairs;

  const blocks = cleaned.split(/\n\s*\n/);
  blocks.forEach(block => {
    const lines = block.split('\n').map(l => l.trim()).filter(Boolean);
    if (lines.length >= 2) {
      let q = lines[0].replace(/^(Q|Question)\s*:\s*/i, '');
      let a = lines.slice(1).join('\n').replace(/^(A|R|Réponse|Response)\s*:\s*/i, '');
      if (q && a) pairs.push({ q, a: formatOutputCode(a) });
    }
  });

  if (!pairs.length) throw new Error('Format non reconnu');
  return pairs;
}

function formatOutputCode(text) {
  if (!text) return '';
  if (!text.includes('```')) {
    return '\n' + text + '\n';
  }
  return text;
}

function parseJSONDataset(raw) {
  const text = String(raw).trim();
  if (!text) return [];

  const extractPair = (item) => {
    const q = String(item?.instruction ?? item?.question ?? item?.input ?? item?.q ?? '').trim();
    let a = String(item?.output ?? item?.answer ?? item?.response ?? item?.a ?? '').trim();
    if (q && a) {
      a = formatOutputCode(a);
      return { q, a };
    }
    return null;
  };

  if (text.startsWith('[')) {
    const data = JSON.parse(text);
    if (!Array.isArray(data)) return [];

    return data.map(extractPair).filter(Boolean);
  }

  const pairs = [];
  for (const line of text.split(/\r?\n/)) {
    if (!line.trim()) continue;
    try {
      const item = JSON.parse(line);
      const pair = extractPair(item);
      if (pair) pairs.push(pair);
    } catch (_) {}
  }
  return pairs;
}

/* ================================================================
   2. RECHERCHE TF-IDF ET GESTION DE L'INDEX
   ================================================================ */
const STOP_FR = new Set(`
le la les l un une des de du d au aux a et ou mais donc or ni car ne pas plus jamais rien
je tu il elle on nous vous ils elles moi toi lui leur eux meme memes
ce cet cette ces c celui celle ceux cela ca
mon ma mes ton ta tes son sa ses notre nos votre vos
est sont suis es etre etants etait etaient ete serai sera seront suis sommes etes
ai as avons avez ont avoir eu aura auront
que qui quoi dont ou quel quelle quels quelles
comment pourquoi quand combien
pour par avec sans sur sous dans en dedans entre vers chez
y se sa sois soit soyons soyez
tout tous toute toutes autre autres memes meme
aussi si tres peut peuvent peux puis puisqu puisque parce
alors donc ainsi cependant toutefois neanmoins
`.split(/\s+/));

function stripAccents(t) { return t.normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }

function stem(w) {
  if (w.length <= 3) return w;
  if (w.endsWith('aux')) return w.slice(0, -3) + 'al';
  for (const suf of ['ements', 'ement', 'ations', 'ation', 'eurs', 'euses', 'euse',
                     'ions', 'tion', 'ives', 'ifs', 'ant', 'ent',
                     'ies', 'es', 's', 'e', 'er', 'ez', 'ee', 'ees']) {
    if (w.endsWith(suf) && w.length - suf.length >= 3) return w.slice(0, -suf.length);
  }
  return w;
}

function tokenize(text, { useStem = true } = {}) {
  const words = stripAccents(text.toLowerCase())
    .replace(/[^a-z0-9\s]/g, ' ')
    .split(/\s+/)
    .filter(t => t.length > 1 && !STOP_FR.has(t) && !/^\d+$/.test(t));
  return useStem ? words.map(stem) : words;
}

function bigrams(tokens) {
  const out = [];
  for (let i = 0; i < tokens.length - 1; i++) out.push(tokens[i] + '_' + tokens[i + 1]);
  return out;
}

let engine = null;

function buildEngine(pairs) {
  const qTokens = pairs.map(p => tokenize(p.q));
  const qBi = qTokens.map(bigrams);
  const N = pairs.length;

  const df = new Map();
  qTokens.forEach((tokens, i) => {
    new Set([...tokens, ...qBi[i]]).forEach(t => df.set(t, (df.get(t) || 0) + 1));
  });

  const idf = new Map();
  df.forEach((d, term) => idf.set(term, Math.log((N + 1) / (d + 1)) + 1));

  const tfidf = qTokens.map((tokens, i) => {
    const tf = new Map();
    [...tokens, ...qBi[i]].forEach(t => tf.set(t, (tf.get(t) || 0) + 1));
    const vec = new Map();
    tf.forEach((f, t) => vec.set(t, (1 + Math.log(f)) * (idf.get(t) || 0)));
    let norm = 0;
    vec.forEach(v => norm += v * v);
    norm = Math.sqrt(norm) || 1;
    vec.forEach((v, t) => vec.set(t, v / norm));
    return vec;
  });

  engine = { docs: pairs, idf, tfidf, qTokens };
}

// Fonction pour télécharger un fichier individuel sans faire planter le navigateur
function triggerDownload(content, filename) {
  const blob = new Blob([content], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}

// Exportation fractionnée en morceaux pour éviter la saturation de mémoire (Out of Memory)
async function exportPrecomputedIndexChunks() {
  if (!engine) {
    showToast('Aucun moteur à exporter');
    return;
  }
  showToast('Préparation de l\'exportation...');

  const CHUNK_SIZE = 1000; // <-- Fixé à 1 000 pour garantir < 15 Mo par fichier
  const totalDocs = engine.docs.length;
  const chunkCount = Math.ceil(totalDocs / CHUNK_SIZE);

  // 1. Export Metadata + IDF
  const metaData = {
    totalDocs: totalDocs,
    chunkCount: chunkCount,
    idf: Object.fromEntries(engine.idf)
  };
  triggerDownload(JSON.stringify(metaData), 'index_meta.json');

  // 2. Export Chunks (docs, qTokens, tfidf)
  for (let c = 0; c < chunkCount; c++) {
    const start = c * CHUNK_SIZE;
    const end = Math.min(start + CHUNK_SIZE, totalDocs);

    const chunkData = {
      chunkIndex: c + 1,
      docs: engine.docs.slice(start, end),
      qTokens: engine.qTokens.slice(start, end),
      tfidf: engine.tfidf.slice(start, end).map(m => Object.fromEntries(m))
    };

    // Pause pour éviter d'asphyxier le processeur lors des 60 téléchargements
    await new Promise(res => setTimeout(res, 200));
    triggerDownload(JSON.stringify(chunkData), `index_chunk_${c + 1}.json`);
  }

  showToast(`Exportation terminée (${chunkCount + 1} fichiers)`);
}

function loadPrecomputedChunks(meta, chunksData) {
  const idf = new Map(Object.entries(meta.idf));
  const docs = [];
  const qTokens = [];
  const tfidf = [];

  chunksData.forEach(chunk => {
    docs.push(...chunk.docs);
    qTokens.push(...chunk.qTokens);
    tfidf.push(...chunk.tfidf.map(obj => new Map(Object.entries(obj))));
  });

  engine = { docs, idf, tfidf, qTokens };
}

function search(query, topK = 3) {
  if (!engine) return [];
  
  const rawQuery = stripAccents(query.toLowerCase()).trim();
  const tokens = tokenize(query);
  if (!tokens.length) return [];
  
  const bi = bigrams(tokens);
  const qTokensSet = new Set(tokens);

  const tf = new Map();
  [...tokens, ...bi].forEach(t => tf.set(t, (tf.get(t) || 0) + 1));
  const qvec = new Map();
  tf.forEach((f, t) => qvec.set(t, (1 + Math.log(f)) * (engine.idf.get(t) || 1)));
  let norm = 0;
  qvec.forEach(v => norm += v * v);
  norm = Math.sqrt(norm) || 1;
  qvec.forEach((v, t) => qvec.set(t, v / norm));

  const scored = engine.docs.map((doc, idx) => {
    const rawDocQ = stripAccents(doc.q.toLowerCase()).trim();
    if (rawDocQ === rawQuery) return { idx, score: 1.0, doc };
    if (rawDocQ.includes(rawQuery) || rawQuery.includes(rawDocQ)) return { idx, score: 0.88, doc };

    const docVec = engine.tfidf[idx];
    let cos = 0;
    qvec.forEach((v, t) => { const w = docVec.get(t); if (w) cos += v * w; });

    const docTokens = new Set(engine.qTokens[idx]);
    let intersection = 0;
    qTokensSet.forEach(t => { if (docTokens.has(t)) intersection++; });
    const jaccard = intersection / Math.max(1, (qTokensSet.size + docTokens.size - intersection));

    const docBi = new Set(bigrams(engine.qTokens[idx]));
    let biHits = 0;
    bi.forEach(b => { if (docBi.has(b)) biHits++; });
    const biScore = bi.length ? biHits / bi.length : 0;

    return { idx, score: (cos * 0.45) + (jaccard * 0.35) + (biScore * 0.20), doc };
  });

  return scored.filter(r => r.score > 0.12).sort((a, b) => b.score - a.score).slice(0, topK);
}

/* ================================================================
   3. CHARGEMENT AUTOMATIQUE RAPIDE (CHUNKS INDEX OU DATASETS)
   ================================================================ */
function setStatus(state, text) {
  $('statusDot').className = 'status-dot ' + state;
  $('statusText').textContent = text;
}

async function loadData() {
  setStatus('loading', 'Chargement...');

  // Étape A: Tenter de charger les index découpés (index_meta.json + index_chunk_X.json)
  try {
    const resMeta = await fetch('index_meta.json?v=' + Date.now(), { cache: 'no-store' });
    if (resMeta.ok) {
      const meta = await resMeta.json();
      const chunkPromises = [];

      for (let i = 1; i <= meta.chunkCount; i++) {
        chunkPromises.push(
          fetch(`index_chunk_${i}.json?v=` + Date.now(), { cache: 'no-store' }).then(r => r.json())
        );
      }

      const chunksData = await Promise.all(chunkPromises);
      loadPrecomputedChunks(meta, chunksData);
      renderChips();
      setStatus('ok', 'Prêt (Chunks)');
      showToast(`Index multi-fichiers chargé ⚡ (${engine.docs.length.toLocaleString('fr-FR')} ex)`);
      return;
    }
  } catch (e) {}

  // Étape B: Fallback vers l'index unique standard si existant
  try {
    const resIndex = await fetch('index.json?v=' + Date.now(), { cache: 'no-store' });
    if (resIndex.ok) {
      const indexData = await resIndex.json();
      if (indexData.docs && indexData.idf && indexData.tfidf) {
        const tfidf = indexData.tfidf.map(obj => new Map(Object.entries(obj)));
        engine = { docs: indexData.docs, idf: new Map(Object.entries(indexData.idf)), tfidf, qTokens: indexData.qTokens };
        renderChips();
        setStatus('ok', 'Prêt (Index)');
        showToast('Index unique chargé ⚡');
        return;
      }
    }
  } catch (e) {}

  // Étape C: Fallback standard datasets bruts
  const files = ['dataset1.json', 'dataset2.json', 'dataset3.json', 'data.txt'];
  const allPairs = [];

  const results = await Promise.allSettled(files.map(async f => {
    const res = await fetch(f + '?v=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error();
    const raw = await res.text();
    return f.endsWith('.txt') ? parseDataFile(raw) : parseJSONDataset(raw);
  }));

  results.forEach(r => { if (r.status === 'fulfilled') allPairs.push(...r.value); });

  if (!allPairs.length) {
    setStatus('error', 'Aucune donnée');
    showToast('Chargement manuel requis');
    $('filePick').click();
    return;
  }

  initEngineFromPairs(allPairs);
  setStatus('ok', 'Prêt');
  showToast(allPairs.length.toLocaleString('fr-FR') + ' exemples calculés');
}

$('filePick').addEventListener('change', async e => {
  const files = Array.from(e.target.files || []);
  if (!files.length) return;

  setStatus('loading', 'Lecture...');
  const allPairs = [];

  for (const file of files) {
    try {
      const raw = await file.text();
      const pairs = (file.name.endsWith('.json') || file.name.endsWith('.jsonl'))
        ? parseJSONDataset(raw) : parseDataFile(raw);
      allPairs.push(...pairs);
    } catch (err) { console.error(err); }
  }

  if (!allPairs.length) {
    setStatus('error', 'Erreur');
    showToast('Aucune donnée valide');
    return;
  }

  initEngineFromPairs(allPairs);
  setStatus('ok', 'Prêt');
  showToast(allPairs.length.toLocaleString('fr-FR') + ' exemples chargés');
});

function initEngineFromPairs(pairs) {
  buildEngine(pairs);
  renderChips();
}

function renderChips() {
  const chips = $('chips');
  if (!chips || !engine) return;
  chips.innerHTML = '';
  engine.docs.slice(0, 4).forEach(d => {
    const b = document.createElement('button');
    b.className = 'chip';
    b.textContent = d.q.length > 42 ? d.q.slice(0, 42) + '...' : d.q;
    b.onclick = () => { input.value = d.q; autoGrow(); send(); };
    chips.appendChild(b);
  });
}

/* ================================================================
   4. HISTORIQUE & FONCTIONS UTILITAIRES
   ================================================================ */
let storageOk = true;
try { localStorage.setItem('aura-t', '1'); localStorage.removeItem('aura-t'); } catch { storageOk = false; }

let history = [];
try { history = JSON.parse(localStorage.getItem('aura-history') || '[]'); } catch { history = []; }

function saveHistory() {
  if (storageOk) localStorage.setItem('aura-history', JSON.stringify(history));
  renderHistory();
}

function renderHistory() {
  const list = $('hpList');
  list.innerHTML = '<div class="hp-group">Conversations</div>';
  if (!history.length) {
    list.innerHTML += '<div class="hp-empty">Aucune conversation</div>';
    return;
  }
  history.forEach((item, index) => {
    const el = document.createElement('div');
    el.className = 'hp-item' + (index === activeChatIndex ? ' active' : '');
    el.textContent = item.title;
    const del = document.createElement('button');
    del.className = 'hp-del'; del.innerHTML = '&#10005;';
    del.onclick = e => {
      e.stopPropagation();
      history.splice(index, 1);
      if (activeChatIndex === index) activeChatIndex = -1;
      saveHistory(); showToast('Supprimée');
    };
    el.onclick = () => loadChat(index);
    el.appendChild(del);
    list.appendChild(el);
  });
}

function loadChat(index) {
  const item = history[index];
  if (!item?.messages?.length) return;
  activeChatIndex = index;
  toggleHistory(false);
  messages.innerHTML = '';
  item.messages.forEach(m => addMsg(m.text, m.who, m.score));
  scrollToBottom();
  showToast('Chat chargé');
}

function clearHistory() {
  if (!history.length) return;
  if (confirm("Effacer tout l'historique ?")) {
    history = []; activeChatIndex = -1; saveHistory(); showToast('Historique effacé');
  }
}

function toggleHistory(open) {
  $('historyPanel').classList.toggle('open', open);
  $('overlay').classList.toggle('show', open);
}

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(showToast.t);
  showToast.t = setTimeout(() => toast.classList.remove('show'), 2000);
}

function escapeHtml(v) {
  return String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function downloadCode(index, filename) {
  const code = rawCodeStore[index];
  if (!code) return;
  const blob = new Blob([code], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
  showToast('Téléchargement lancé');
}

function copyCodeStored(btn, index) {
  const code = rawCodeStore[index];
  if (!code) return;
  navigator.clipboard.writeText(code).then(() => {
    const orig = btn.textContent;
    btn.textContent = 'Copié !';
    setTimeout(() => btn.textContent = orig, 1500);
  }).catch(() => showToast('Erreur de copie'));
}

function askSuggestion(queryText) {
  input.value = queryText;
  autoGrow();
  send();
}

function parseMarkdown(text) {
  const blocks = [];

  let formatted = text.replace(/```(\w*)\n([\s\S]*?)```/g, (match, lang, code) => {
    lang = lang.trim() || 'text';
    const cleanCode = code.trim();
    const storeIdx = rawCodeStore.length;
    rawCodeStore.push(cleanCode);

    const extMap = { js: 'js', javascript: 'js', html: 'html', css: 'css', python: 'py', py: 'py', cpp: 'cpp', c: 'c', json: 'json' };
    const ext = extMap[lang.toLowerCase()] || 'txt';
    const filename = `script.${ext}`;

    const html = `<div class="code-box">
      <div class="code-head">
        <span>${lang.toUpperCase()}</span>
        <div class="code-actions">
          <button class="code-btn" onclick="copyCodeStored(this, ${storeIdx})">📋 Copier</button>
          <button class="code-btn" onclick="downloadCode(${storeIdx}, '${filename}')">⬇️ Télécharger</button>
        </div>
      </div>
      <pre><code>${escapeHtml(cleanCode)}</code></pre>
    </div>`;

    blocks.push(html);
    return `___BLOCK_${blocks.length - 1}___`;
  });

  const parts = formatted.split(/\n/);
  let htmlResult = parts.map(line => {
    const trimmed = line.trim();
    if (trimmed.startsWith('• ') || trimmed.startsWith('&bull; ')) {
      const qStr = trimmed.replace(/^(•|&bull;)\s*/, '');
      const btnHtml = `<button class="sugg-btn" onclick="askSuggestion('${qStr.replace(/'/g, "\\'")}')">• ${escapeHtml(qStr)}</button>`;
      blocks.push(btnHtml);
      return `___BLOCK_${blocks.length - 1}___`;
    }
    return escapeHtml(line);
  }).join('<br>');

  blocks.forEach((b, i) => {
    htmlResult = htmlResult.replace(`___BLOCK_${i}___`, b);
  });

  return htmlResult.replace(/(<br>\s*)+(<div class="code-box">|<button class="sugg-btn")/g, '$2')
                   .replace(/(<\/div>|<\/button>)(<br>\s*)+/g, '$1');
}

/* ================================================================
   5. FLUX ET DISCUSSIONS
   ================================================================ */
function addMsg(text, who, score = null) {
  $('hero')?.remove();
  const div = document.createElement('div');
  div.className = `msg-wrap msg ${who}`;
  const label = document.createElement('div');
  label.className = 'msg-label';
  label.textContent = who === 'ai' ? '◆ Aura' : 'Vous';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  div.append(label, bubble);
  messages.appendChild(div);

  if (who === 'ai') {
    bubble.innerHTML = parseMarkdown(text) || '&nbsp;';
  } else {
    bubble.textContent = text;
  }

  if (who === 'ai' && score !== null) {
    const badge = document.createElement('div');
    badge.className = 'score-badge';
    badge.textContent = 'Pertinence : ' + (score * 100).toFixed(0) + '%';
    div.appendChild(badge);
  }
  scrollToBottom();
  return div;
}

function streamText(bubble, text, container, onComplete) {
  let index = 0;
  const cursor = document.createElement('span');
  cursor.className = 'cursor-blink';
  bubble.textContent = '';
  bubble.appendChild(cursor);

  const timer = setInterval(() => {
    index += 4;
    const currentChunk = text.slice(0, index);
    bubble.innerHTML = parseMarkdown(currentChunk);
    bubble.appendChild(cursor);
    scrollToBottom();

    if (index >= text.length) {
      clearInterval(timer);
      cursor.remove();
      bubble.innerHTML = parseMarkdown(text);
      onComplete?.();

      const actions = document.createElement('div');
      actions.className = 'msg-actions';
      const copy = document.createElement('button');
      copy.className = 'ma-btn'; copy.textContent = 'Copier le texte';
      copy.onclick = () => navigator.clipboard.writeText(text)
        .then(() => showToast('Copié !')).catch(() => showToast('Impossible de copier'));

      const regen = document.createElement('button');
      regen.className = 'ma-btn'; regen.textContent = 'Régénérer';
      regen.onclick = () => {
        if (isGenerating) return;
        bubble.innerHTML = '<span class="typing-line"></span>';
        setTimeout(() => {
          const reply = formatAnswer(search(lastQuery), lastQuery);
          streamText(bubble, reply.text, container, () => updateActiveChat(reply.text, 'ai', reply.score));
        }, 500);
      };
      actions.append(copy, regen);
      container.appendChild(actions);
    }
  }, 10);
}

function formatAnswer(results, query) {
  if (!engine) {
    return { text: "Veuillez charger vos fichiers de données pour poser vos questions.", score: null };
  }
  if (!results.length) {
    return { text: `Désolé, aucun résultat pour « ${query} ». Essaye de reformuler ta question.`, score: null };
  }
  const best = results[0];
  let text = best.doc.a;
  if (results.length > 1 && results[1].score > 0.20) {
    text += '\n\n────────────────\n\nQuestions similaires :\n\n' +
      results.slice(1).map(r => '• ' + r.doc.q).join('\n\n');
  }
  return { text, score: best.score };
}

function send(event) {
  event?.preventDefault();
  const text = input.value.trim();
  if (!text || isGenerating) return;
  isGenerating = true;
  lastQuery = text;
  addMsg(text, 'user');

  input.value = '';
  autoGrow();
  $('sendBtn').disabled = true;

  const typing = document.createElement('div');
  typing.className = 'msg-wrap msg ai';
  typing.innerHTML = '<div class="msg-label">◆ Aura</div><div class="typing-line"></div>';
  messages.appendChild(typing);
  scrollToBottom();

  setTimeout(() => {
    try {
      typing.remove();
      const reply = formatAnswer(search(text), text);
      const msg = addMsg('', 'ai');
      streamText(msg.querySelector('.bubble'), reply.text, msg,
        () => updateActiveChat(reply.text, 'ai', reply.score));

      if (activeChatIndex === -1 || !history[activeChatIndex]) {
        history.unshift({ title: text.slice(0, 42), messages: [] });
        activeChatIndex = 0;
      }
      updateActiveChat(text, 'user', null);
    } catch (err) {
      typing.remove();
      addMsg('Erreur : ' + err.message, 'ai');
    }
    isGenerating = false;
    $('sendBtn').disabled = false;
  }, 250);
}

function updateActiveChat(text, who, score) {
  const item = history[activeChatIndex];
  if (!item) return;
  item.messages.push({ text, who, score });
  saveHistory();
}

function newChat() {
  activeChatIndex = -1;
  messages.innerHTML = HERO_HTML;
  renderChips();
  showToast('Nouvelle conversation');
}

function onKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(e); }
}

function autoGrow() {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 140) + 'px';
}

/* ===== INIT ===== */
messages.innerHTML = HERO_HTML;
renderHistory();
autoGrow();
input.focus();
loadData();
</script>
